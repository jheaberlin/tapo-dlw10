name: Feature request
description: Suggest a safe improvement or supported capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the Home Assistant behavior and any safety implications.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Relevant device model and firmware
      placeholder: DLW10, firmware 1.0.15
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and requests.
          required: true
        - label: This request contains no credentials, tokens, device secrets, or private network details.
          required: true
